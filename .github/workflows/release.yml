name: Standalone candidate evidence

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full 40-character commit SHA to build and bind
        required: true
        type: string
      product_version:
        description: Windows product version in a.b.c.d form
        required: true
        type: string
      setup_version:
        description: Setup version in a.b.c form
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate-evidence:
    name: Build candidate evidence without publishing
    runs-on: windows-latest
    env:
      EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
      ACS_PRODUCT_VERSION: ${{ inputs.product_version }}
      ACS_SETUP_VERSION: ${{ inputs.setup_version }}
    steps:
      - name: Validate dispatch inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_SOURCE_COMMIT -notmatch '^[0-9a-fA-F]{40}$') { throw 'source_commit must be a full 40-character Git SHA.' }
          if ($env:ACS_PRODUCT_VERSION -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'product_version must use a.b.c.d form.' }
          if ($env:ACS_SETUP_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'setup_version must use a.b.c form.' }
          $productParts = $env:ACS_PRODUCT_VERSION.Split('.')
          $expectedSetupVersion = "$($productParts[0]).$($productParts[1]).$($productParts[2])"
          if ($env:ACS_SETUP_VERSION -ne $expectedSetupVersion) { throw "setup_version must equal the first three product_version components ($expectedSetupVersion)." }

      - name: Checkout the requested source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1

      - name: Verify checked-out source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actualCommit = (git rev-parse HEAD).Trim()
          if ($actualCommit -ne $env:EXPECTED_SOURCE_COMMIT.ToLowerInvariant()) { throw "Checked out commit $actualCommit does not match requested commit $env:EXPECTED_SOURCE_COMMIT." }

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Standalone build graph from lock files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = @(
            'src/AutoCardSync.Standalone.Core/AutoCardSync.Standalone.Core.csproj',
            'src/AutoCardSync.Standalone/AutoCardSync.Standalone.csproj',
            'src/AutoCardSync.Standalone.Installer/AutoCardSync.Standalone.Installer.csproj',
            'src/AutoCardSync.Bootstrapper/AutoCardSync.Bootstrapper.csproj'
          )
          foreach ($project in $projects) {
            dotnet restore $project --locked-mode
            if ($LASTEXITCODE -ne 0) { throw "Restore failed: $project" }
          }

      - name: Build Standalone Core
        shell: pwsh
        run: |
          dotnet build src/AutoCardSync.Standalone.Core/AutoCardSync.Standalone.Core.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Standalone Core build failed.' }

      - name: Download pinned offline prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-VerifiedPrerequisite([string] $MetadataPath, [string] $DestinationPath) {
            $metadata = Get-Content -LiteralPath $MetadataPath -Raw -Encoding utf8 | ConvertFrom-Json
            $parent = Split-Path -Parent $DestinationPath
            New-Item -ItemType Directory -Path $parent -Force | Out-Null
            Invoke-WebRequest -Uri ([string]$metadata.downloadUrl) -OutFile $DestinationPath -MaximumRedirection 10
            $item = Get-Item -LiteralPath $DestinationPath
            if ($item.Length -ne [long]$metadata.size) { throw "Downloaded prerequisite size mismatch: $DestinationPath" }
            $actualHash = (Get-FileHash -LiteralPath $DestinationPath -Algorithm SHA512).Hash
            if ($actualHash -ne ([string]$metadata.sha512).ToUpperInvariant()) { throw "Downloaded prerequisite SHA-512 mismatch: $DestinationPath" }
          }

          Get-VerifiedPrerequisite 'eng/installer/dotnet-desktop-runtime-10.0.10-win-x64.json' 'artifacts/prerequisites/windowsdesktop-runtime-10.0.10-win-x64.exe'
          Get-VerifiedPrerequisite 'eng/installer/webview2-evergreen-standalone-x64.json' 'artifacts/prerequisites/MicrosoftEdgeWebView2RuntimeInstallerX64-standalone.exe'

      - name: Build Standalone setup and run its static bundle validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/Build-StandaloneSetup.ps1 -Configuration Release -ProductVersion $env:ACS_PRODUCT_VERSION -SetupVersion $env:ACS_SETUP_VERSION

      - name: Create candidate manifest bound to source, version, and hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = (Get-Location).Path
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($sourceCommit -ne $env:EXPECTED_SOURCE_COMMIT.ToLowerInvariant()) { throw 'Manifest source commit would not match the requested source commit.' }

          $paths = @(
            "artifacts/installer/standalone/AutoCardSync-Standalone.msi",
            "artifacts/setup/standalone/AutoCardSync-Setup-$($env:ACS_SETUP_VERSION).exe",
            'artifacts/verification/standalone-setup-static-latest.json'
          )
          $files = foreach ($relativePath in $paths) {
            $fullPath = Join-Path $repoRoot $relativePath
            if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) { throw "Required candidate output is missing: $relativePath" }
            $item = Get-Item -LiteralPath $fullPath
            [ordered]@{
              path = $relativePath.Replace('\', '/')
              size = [long]$item.Length
              sha256 = (Get-FileHash -LiteralPath $fullPath -Algorithm SHA256).Hash
            }
          }

          $manifest = [ordered]@{
            schemaVersion = 1
            purpose = 'standalone-candidate-evidence'
            sourceCommit = $sourceCommit
            productVersion = $env:ACS_PRODUCT_VERSION
            setupVersion = $env:ACS_SETUP_VERSION
            generatedAtUtc = [DateTimeOffset]::UtcNow.ToString('O')
            workflowRun = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            signing = 'not-performed'
            externalAcceptance = 'not-performed'
            publication = 'not-performed'
            files = $files
          }
          $outputDirectory = Join-Path $repoRoot 'artifacts/candidate'
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null
          $manifestPath = Join-Path $outputDirectory 'STANDALONE-CANDIDATE-MANIFEST.json'
          [System.IO.File]::WriteAllText($manifestPath, ($manifest | ConvertTo-Json -Depth 8) + [Environment]::NewLine, [System.Text.UTF8Encoding]::new($false))

      - name: Upload candidate evidence only
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: standalone-candidate-${{ inputs.source_commit }}
          path: |
            artifacts/installer/standalone/AutoCardSync-Standalone.msi
            artifacts/setup/standalone/
            artifacts/verification/standalone-setup-static-latest.json
            artifacts/candidate/STANDALONE-CANDIDATE-MANIFEST.json
          retention-days: 30
          if-no-files-found: error

      - name: Record publication boundary
        shell: pwsh
        run: |
          @"
          This workflow created unsigned candidate evidence only.
          It did not create a GitHub Release, publish an installer, sign artifacts,
          or treat external acceptance as complete.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
